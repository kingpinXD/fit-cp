name: fit_cp
description: "Fit — workout programme tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.0.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true

  assets:
    - assets/programmes/
